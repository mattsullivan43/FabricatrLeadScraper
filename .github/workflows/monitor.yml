name: monitor

on:
  schedule:
    # Every 15 minutes on off-peak minutes: GitHub delays or drops schedules that fire
    # on :00/:15/:30/:45 alongside everyone else. Do not go faster — Reddit throttles.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print Slack messages to the log instead of posting; do not write state"
        type: boolean
        default: false
      no_classify:
        description: "Skip the OpenAI classifier (keyword layer only)"
        type: boolean
        default: false
      probe:
        description: "Only check which feeds are alive from the GitHub runner"
        type: boolean
        default: false
      ignore_seen:
        description: "Treat every entry as new (testing; combine with dry_run)"
        type: boolean
        default: false
      reset_baseline:
        description: "Forget all seen IDs and re-baseline (sends nothing this run)"
        type: boolean
        default: false
      slack_test:
        description: "Post one test message to the Slack webhook and exit"
        type: boolean
        default: false
      chain:
        description: "Keep the 15-minute loop going: after this run, wait and dispatch the next one"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the run dispatch the next run (self-chaining 15-minute loop)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # must exceed the 15-minute chain wait or GitHub cancels the run mid-sleep
    steps:
      - name: Record start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.no_classify }}" = "true" ] && ARGS="$ARGS --no-classify"
          [ "${{ inputs.probe }}" = "true" ] && ARGS="$ARGS --probe"
          [ "${{ inputs.ignore_seen }}" = "true" ] && ARGS="$ARGS --ignore-seen"
          [ "${{ inputs.reset_baseline }}" = "true" ] && ARGS="$ARGS --reset-baseline"
          [ "${{ inputs.slack_test }}" = "true" ] && ARGS="$ARGS --slack-test"
          echo "python monitor.py $ARGS"
          python monitor.py $ARGS

      - name: Commit seen state
        if: ${{ inputs.dry_run != true && inputs.probe != true && inputs.slack_test != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # If someone pushed to main during this run, rebase our single state commit on top.
          git pull --rebase origin main || { git rebase --abort 2>/dev/null; echo "rebase failed"; exit 1; }
          git push origin HEAD:main

      # GitHub's cron scheduler is best-effort and was not firing at all for this repo, so the
      # loop keeps itself alive: wait out the rest of the 15-minute slot, then dispatch the next
      # run. The concurrency group above collapses any overlap with a cron-triggered run.
      # Runs with probe / dry_run / slack_test never chain, so test clicks don't start a second loop.
      - name: Schedule next run in 15 minutes
        if: ${{ always() && (github.event_name == 'schedule' || inputs.chain == true) && inputs.probe != true && inputs.dry_run != true && inputs.slack_test != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date +%s)
          WAIT=$(( 900 - (NOW - ${RUN_START:-$NOW}) ))
          [ "$WAIT" -lt 600 ] && WAIT=600   # never chain faster than 10 min even if the clock math is off
          echo "next run in ${WAIT}s"
          sleep "$WAIT"
          gh workflow run monitor.yml --ref main -f chain=true
          echo "dispatched next run at $(date -u +%H:%M:%SZ)"
